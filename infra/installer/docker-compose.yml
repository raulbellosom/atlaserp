name: runlyerp

services:
  collabora:
    image: collabora/code:26.04.2.4.1
    profiles: ["office"]
    environment:
      aliasgroup1: ${COLLABORA_WOPI_HOST:-http://api:4010}
      extra_params: ${COLLABORA_EXTRA_PARAMS:---o:ssl.enable=false --o:ssl.termination=false --o:logging.level=warning}
      content_security_policy: ${COLLABORA_CONTENT_SECURITY_POLICY:-frame-ancestors http://localhost:5173 http://tauri.localhost https://tauri.localhost tauri://localhost;}
    ports:
      - "127.0.0.1:9980:9980"
    # CODE 26 includes /usr/bin/coolwsd --probe; retain its native healthcheck.
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  runly-api-external:
    image: ${RUNLY_API_IMAGE-${ATLAS_API_IMAGE:-raulbellosom/runlyerp:api-latest}}
    container_name: runly-api-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      RUNLY_PROJECT_ROOT: /app
      ATLAS_PROJECT_ROOT: /app
      RUNLY_MODULES_DIR: /app/modules/custom
      ATLAS_MODULES_DIR: /app/modules/custom
    ports:
      - "4010:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  runly-worker-external:
    image: ${RUNLY_WORKER_IMAGE-${ATLAS_WORKER_IMAGE:-raulbellosom/runlyerp:worker-latest}}
    container_name: runly-worker-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      RUNLY_PROJECT_ROOT: /app
      ATLAS_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    restart: unless-stopped

  runly-web-external:
    image: ${RUNLY_WEB_EXTERNAL_IMAGE-${ATLAS_WEB_EXTERNAL_IMAGE:-raulbellosom/runlyerp:web-latest}}
    container_name: runly-web-external
    profiles: ["external"]
    environment:
      RUNLY_API_URL: ${RUNLY_API_URL-${ATLAS_API_URL:-}}
      ATLAS_API_URL: ${RUNLY_API_URL-${ATLAS_API_URL:-}}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - runly-api-external
    restart: unless-stopped

  runly-api-local:
    image: ${RUNLY_API_LOCAL_IMAGE-${ATLAS_API_LOCAL_IMAGE:-raulbellosom/runlyerp:api-latest}}
    container_name: runly-api-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      RUNLY_PROJECT_ROOT: /app
      ATLAS_PROJECT_ROOT: /app
      RUNLY_MODULES_DIR: /app/modules/custom
      ATLAS_MODULES_DIR: /app/modules/custom
    ports:
      - "4010:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  runly-worker-local:
    image: ${RUNLY_WORKER_LOCAL_IMAGE-${ATLAS_WORKER_LOCAL_IMAGE:-raulbellosom/runlyerp:worker-latest}}
    container_name: runly-worker-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      RUNLY_PROJECT_ROOT: /app
      ATLAS_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    restart: unless-stopped

  runly-web-local:
    image: ${RUNLY_WEB_LOCAL_IMAGE-${ATLAS_WEB_LOCAL_IMAGE:-raulbellosom/runlyerp:web-latest}}
    container_name: runly-web-local
    profiles: ["local"]
    environment:
      RUNLY_API_URL: ${RUNLY_API_URL-${ATLAS_API_URL:-http://localhost:4010}}
      ATLAS_API_URL: ${RUNLY_API_URL-${ATLAS_API_URL:-http://localhost:4010}}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - runly-api-local
    restart: unless-stopped

  livekit-redis:
    image: ${LIVEKIT_REDIS_IMAGE:-redis:7-alpine}
    container_name: runly-livekit-redis
    profiles: ["livekit"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    container_name: runly-livekit
    profiles: ["livekit"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      livekit-redis:
        condition: service_healthy
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  # Separate opt-in profile (not bundled into "livekit") because this
  # container mounts the host's docker.sock — a materially larger trust
  # boundary than livekit/livekit-redis, which have no host access at all.
  # Same reasoning as livekit-caddy's own "livekit-tls" profile: an optional
  # add-on to the base voice/video stack shouldn't be silently included for
  # every deployment. Enable with:
  #   docker compose --profile livekit --profile livekit-egress up -d
  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.9.0}
    container_name: runly-livekit-egress
    profiles: ["livekit-egress"]
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress/egress.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      livekit-redis:
        condition: service_started
      livekit:
        condition: service_started

  livekit-caddy:
    image: ${LIVEKIT_CADDY_IMAGE:-caddy:2-alpine}
    container_name: runly-livekit-caddy
    profiles: ["livekit-tls"]
    depends_on:
      - livekit
    volumes:
      - ./livekit/Caddyfile:/etc/caddy/Caddyfile:ro
      - livekit-caddy-data:/data
      - livekit-caddy-config:/config
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    restart: unless-stopped

volumes:
  livekit-caddy-data:
  livekit-caddy-config:
