name: atlaserp

services:
  atlas-api-external:
    image: ${ATLAS_API_IMAGE:-raulbellosom/atlaserp:api-latest}
    container_name: atlas-api-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      ATLAS_PROJECT_ROOT: /app
      ATLAS_MODULES_DIR: /app/modules/custom
    ports:
      - "4010:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  atlas-worker-external:
    image: ${ATLAS_WORKER_IMAGE:-raulbellosom/atlaserp:worker-latest}
    container_name: atlas-worker-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      ATLAS_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
    restart: unless-stopped

  atlas-web-external:
    image: ${ATLAS_WEB_EXTERNAL_IMAGE:-raulbellosom/atlaserp:web-latest}
    container_name: atlas-web-external
    profiles: ["external"]
    environment:
      ATLAS_API_URL: ${ATLAS_API_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - atlas-api-external
    restart: unless-stopped

  atlas-api-local:
    image: ${ATLAS_API_LOCAL_IMAGE:-raulbellosom/atlaserp:api-latest}
    container_name: atlas-api-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      ATLAS_PROJECT_ROOT: /app
      ATLAS_MODULES_DIR: /app/modules/custom
    ports:
      - "4010:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  atlas-worker-local:
    image: ${ATLAS_WORKER_LOCAL_IMAGE:-raulbellosom/atlaserp:worker-latest}
    container_name: atlas-worker-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      ATLAS_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
    restart: unless-stopped

  atlas-web-local:
    image: ${ATLAS_WEB_LOCAL_IMAGE:-raulbellosom/atlaserp:web-latest}
    container_name: atlas-web-local
    profiles: ["local"]
    environment:
      ATLAS_API_URL: ${ATLAS_API_URL:-http://localhost:4010}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - atlas-api-local
    restart: unless-stopped

  livekit-redis:
    image: ${LIVEKIT_REDIS_IMAGE:-redis:7-alpine}
    container_name: atlas-livekit-redis
    profiles: ["livekit"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    container_name: atlas-livekit
    profiles: ["livekit"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      livekit-redis:
        condition: service_healthy
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  livekit-caddy:
    image: ${LIVEKIT_CADDY_IMAGE:-caddy:2-alpine}
    container_name: atlas-livekit-caddy
    profiles: ["livekit-tls"]
    depends_on:
      - livekit
    volumes:
      - ./livekit/Caddyfile:/etc/caddy/Caddyfile:ro
      - livekit-caddy-data:/data
      - livekit-caddy-config:/config
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    restart: unless-stopped

volumes:
  livekit-caddy-data:
  livekit-caddy-config:
